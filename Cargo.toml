[package]
name = "multi-roblox"
version = "1.0.0"
edition = "2021"
description = "Run multiple Roblox clients on one Windows machine"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["file", "http", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "2"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
